name: hymo
channels:
  - defaults
dependencies:
  # Keep Conda responsible only for the legacy Python toolchain. The pip
  # packages below follow the tested order in EnviromentSet.txt; versions are
  # pinned to the Python 3.7-compatible set also used by the Docker image.
  - python=3.7.16
  - pip=22.3.1
  - setuptools=65.6.3
  - wheel=0.38.4
  - pip:
      - psutil==5.9.4
      - PySide2==5.15.2.1
      - shiboken2==5.15.2.1
      - numpy==1.21.6
      - SimpleITK==2.0.2
      - matplotlib==3.4.0
      - opencv-python==4.5.4.60
      - scipy==1.7.3
      - scikit-image==0.19.3
      - vtk==9.2.6
      - scikit-learn==1.0.2
      - pandas==1.3.5
      - more-itertools==9.1.0
      - meshio==5.3.4
      - PyYAML==6.0
      - pyradiomics==3.0.1
      - pyvista==0.38.3
      - pyvistaqt==0.9.1
      - pyinstaller==5.8.0
      - openpyxl==3.1.1
      - networkx==2.6.3
